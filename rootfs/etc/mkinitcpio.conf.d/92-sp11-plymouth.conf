# Boot splash (Plymouth with the SP11 theme) and the early display chain it
# needs. The hook is /etc/initcpio/install/sp11plymouth; the kernel command
# line needs "splash" for the splash to show, and "quiet" keeps the kernel's
# own messages off the panel. Without owner firmware the display only comes
# up after switch-root and the splash starts later; nothing breaks.
HOOKS+=(sp11plymouth)
