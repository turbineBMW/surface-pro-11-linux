# /etc/systemd/system/gdm.service.d/10-sp11-wait-drm.conf
# gdm.service is ordered only after plymouth-start, and on the SP11 it started
# (8.7 s) before msm bound (9.05 s). gdm then told plymouth to deactivate before
# a real display existed, so the splash never appeared. Wait for card0 (max
# 15 s), then give plymouth half a second to paint before gdm takes over.
[Service]
ExecStartPre=/usr/bin/sh -c 'for i in $(seq 1 150); do [ -e /dev/dri/card0 ] && { sleep 0.5; exit 0; }; sleep 0.1; done; exit 0'
