# /etc/plymouth/plymouthd.conf — SP11
[Daemon]
Theme=sp11
ShowDelay=0
# Plymouth only uses plain fbdev devices once this timer fires. On the SP11 the
# UEFI framebuffer (efifb) is NOT what the panel scans out after boot — pixels
# written there never show — and if plymouth adopts it first, the script caches
# efifb's geometry (2880x1920, scale 1) and later draws the msm DRM display
# (HiDPI, scale 2) offset into the bottom-right corner. So: never use efifb;
# wait for msm/card0, which the initramfs now brings up early.
DeviceTimeout=30
