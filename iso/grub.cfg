set default=0
set timeout=8

# Owner-supplied firmware lives on the writable SP11FW partition of the same
# USB stick (collected by RUN-IN-WINDOWS.cmd or sp11-firmware). When the
# five files are present GRUB wraps them into the initramfs (newc:), so they
# are in /usr/lib/firmware before any driver loads.
set fwdir=usr/lib/firmware/qcom/x1e80100/microsoft
set initramfs=/sp11/initramfs-7.2.0-sp11-73beta1-live.img

function sp11_firmware_present {
	if search --no-floppy --label --set=sp11fw SP11FW; then
		if [ -f ($sp11fw)/SP11-FIRMWARE-MANIFEST.tsv -a -f ($sp11fw)/$fwdir/Denali/adsp_dtb.mbn -a -f ($sp11fw)/$fwdir/Denali/qcadsp8380.mbn -a -f ($sp11fw)/$fwdir/Denali/cdsp_dtb.mbn -a -f ($sp11fw)/$fwdir/Denali/qccdsp8380.mbn -a -f ($sp11fw)/$fwdir/qcdxkmsuc8380.mbn ]; then
			return 0
		fi
	fi
	return 1
}

function sp11_load_initrd {
	if sp11_firmware_present; then
		echo 'Owner firmware found on SP11FW: loading it together with the initramfs ...'
		initrd ($sp11iso)$initramfs newc:SP11-FIRMWARE-MANIFEST.tsv:($sp11fw)/SP11-FIRMWARE-MANIFEST.tsv newc:$fwdir/Denali/adsp_dtb.mbn:($sp11fw)/$fwdir/Denali/adsp_dtb.mbn newc:$fwdir/Denali/qcadsp8380.mbn:($sp11fw)/$fwdir/Denali/qcadsp8380.mbn newc:$fwdir/Denali/cdsp_dtb.mbn:($sp11fw)/$fwdir/Denali/cdsp_dtb.mbn newc:$fwdir/Denali/qccdsp8380.mbn:($sp11fw)/$fwdir/Denali/qccdsp8380.mbn newc:$fwdir/qcdxkmsuc8380.mbn:($sp11fw)/$fwdir/qcdxkmsuc8380.mbn
	else
		echo 'No owner firmware on SP11FW yet: audio and GPU acceleration stay off until it is collected.'
		initrd ($sp11iso)$initramfs
	fi
}

menuentry 'Surface Pro 11 Linux beta (live, Linux 7.3 port)' --id sp11-live-port73 {
	search --no-floppy --label --set=sp11iso SP11BETA
	echo 'Loading the Surface Pro 11 Linux 7.3 port kernel ...'
	linux ($sp11iso)/sp11/Image-7.2.0-sp11-73beta1 root=LABEL=SP11BETA rw rd.log=console loglevel=7 systemd.tpm2_wait=false efi_pstore.pstore_disable=0 mem_sleep_default=deep cpufreq.default_governor=schedutil quiet splash sp11live=LABEL=SP11BETA
	devicetree ($sp11iso)/sp11/x1e80100-microsoft-denali-oled.dtb
	echo 'Loading the live root filesystem (copied to RAM; this takes a moment) ...'
	sp11_load_initrd
}

menuentry 'Surface Pro 11 Linux beta (live, CPU idle states off)' --id sp11-live-port73-safe {
	search --no-floppy --label --set=sp11iso SP11BETA
	echo 'Loading the Surface Pro 11 Linux 7.3 port kernel with cpuidle off ...'
	linux ($sp11iso)/sp11/Image-7.2.0-sp11-73beta1 root=LABEL=SP11BETA rw rd.log=console loglevel=7 systemd.tpm2_wait=false efi_pstore.pstore_disable=0 mem_sleep_default=deep cpufreq.default_governor=schedutil cpuidle.off=1 sp11live=LABEL=SP11BETA
	devicetree ($sp11iso)/sp11/x1e80100-microsoft-denali-oled.dtb
	echo 'Loading the live root filesystem (copied to RAM; this takes a moment) ...'
	sp11_load_initrd
}
